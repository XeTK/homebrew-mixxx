---
name: Mirror to GitHub

# Gitea is the source of truth. This pushes `main` to github.com/XeTK/homebrew-mixxx so
# that `brew tap XeTK/mixxx` works for anyone, without credentials, and keeps working when
# the homelab is down.
#
# Why a workflow and not a Gitea push mirror: Gitea 1.26's push-mirror API cannot set up
# SSH authentication (no use_ssh field), and the HTTPS alternative needs a GitHub token that
# can reach every XeTK repo. A deploy key only works on this one repository.
#
# Runs on nixos-deploy (this repo's own runner registration on the NixOS deploy VM, see
# xetk/nixos-runners). The push is ci-kit's github-mirror action: ssh.github.com:443
# (outbound 22 is often filtered), with GitHub's host keys pinned in ci-kit.
#
# Secret (Settings -> Actions -> Secrets): MIRROR_DEPLOY_KEY = private half of the write
# deploy key registered on XeTK/homebrew-mixxx. Backup: ~/.creds homebrew_mixxx_mirror_deploy_key.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-github
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main to GitHub
    runs-on: nixos-deploy
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ci-kit (xetk-infra/ci-kit) is not anonymously readable and the runner
      # clones full-URL `uses:` actions without credentials, so check it out
      # with the read-only CI_KIT_TOKEN and use the action from the workspace.
      - name: Check out ci-kit
        uses: actions/checkout@v7
        with:
          repository: xetk-infra/ci-kit
          ref: v1
          token: ${{ secrets.CI_KIT_TOKEN }}
          path: .ci-kit

      # Push Gitea's main (not HEAD), so a manual dispatch from another branch can never
      # publish that branch as the tap's main. Force: the GitHub copy must always equal
      # Gitea's main, even after history edits.
      - name: Push to GitHub
        uses: ./.ci-kit/github-mirror
        with:
          repo: XeTK/homebrew-mixxx
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          refspecs: refs/remotes/origin/main:refs/heads/main
          force: "true"
